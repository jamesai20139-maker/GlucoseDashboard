name: release

# 打 tag（v*）即觸發：在 windows-latest 上編譯單一 exe（前端以 rust-embed 嵌入），
# 並上傳為 GitHub Release 資產 glucose-dashboard.exe。installer/get.ps1 會抓取此資產。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm --prefix frontend ci
        shell: bash
      - name: Build frontend (dist)
        run: npm --prefix frontend run build
        shell: bash

      # Release build：rust-embed 在 release profile 會把 frontend/dist 真正嵌入二進位。
      - name: Build backend (release)
        run: cargo build --manifest-path backend/Cargo.toml --release
        shell: bash

      # 產物重新命名為固定的 glucose-dashboard.exe，installer/get.ps1 依此名稱抓取。
      - name: Stage release asset
        shell: pwsh
        run: |
          $src = "backend/target/release/glucose-dashboard.exe"
          if (-not (Test-Path $src)) { throw "找不到 $src" }
          Copy-Item $src "glucose-dashboard.exe" -Force
          Write-Host "asset size: $((Get-Item glucose-dashboard.exe).Length) bytes"

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          files: glucose-dashboard.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}